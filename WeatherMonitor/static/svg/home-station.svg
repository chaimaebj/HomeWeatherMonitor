<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="500" fill="#2c3e50" opacity="0.1"/>
  
  <!-- House outline -->
  <g>
    <!-- Main house -->
    <path d="M200,300 L200,200 L300,130 L400,200 L400,300 Z" fill="#34495e" stroke="#ecf0f1" stroke-width="3"/>
    <!-- Roof -->
    <path d="M180,200 L300,100 L420,200 Z" fill="#2980b9" stroke="#ecf0f1" stroke-width="3"/>
    <!-- Door -->
    <rect x="275" y="250" width="50" height="50" fill="#e67e22" stroke="#ecf0f1" stroke-width="2"/>
    <circle cx="315" cy="275" r="3" fill="#ecf0f1"/>
    <!-- Window left -->
    <rect x="225" y="220" width="30" height="30" fill="#3498db" stroke="#ecf0f1" stroke-width="2"/>
    <line x1="240" y1="220" x2="240" y2="250" stroke="#ecf0f1" stroke-width="2"/>
    <line x1="225" y1="235" x2="255" y2="235" stroke="#ecf0f1" stroke-width="2"/>
    <!-- Window right -->
    <rect x="345" y="220" width="30" height="30" fill="#3498db" stroke="#ecf0f1" stroke-width="2"/>
    <line x1="360" y1="220" x2="360" y2="250" stroke="#ecf0f1" stroke-width="2"/>
    <line x1="345" y1="235" x2="375" y2="235" stroke="#ecf0f1" stroke-width="2"/>
  </g>
  
  <!-- Weather station equipment -->
  <g>
    <!-- Tower/pole -->
    <rect x="450" y="150" width="10" height="150" fill="#95a5a6" stroke="#7f8c8d" stroke-width="1"/>
    
    <!-- Anemometer (wind speed) -->
    <circle cx="455" cy="150" r="5" fill="#bdc3c7"/>
    <g transform="translate(455, 150)">
      <line x1="0" y1="0" x2="30" y2="0" stroke="#bdc3c7" stroke-width="2"/>
      <line x1="0" y1="0" x2="-15" y2="-25" stroke="#bdc3c7" stroke-width="2"/>
      <line x1="0" y1="0" x2="-15" y2="25" stroke="#bdc3c7" stroke-width="2"/>
      <circle cx="30" cy="0" r="4" fill="#ecf0f1"/>
      <circle cx="-15" cy="-25" r="4" fill="#ecf0f1"/>
      <circle cx="-15" cy="25" r="4" fill="#ecf0f1"/>
      <animateTransform attributeName="transform" 
                        type="rotate" 
                        from="0 455 150" 
                        to="360 455 150" 
                        dur="4s" 
                        repeatCount="indefinite"/>
    </g>
    
    <!-- Weather vane -->
    <line x1="455" y1="180" x2="490" y2="180" stroke="#7f8c8d" stroke-width="2"/>
    <polygon points="490,175 490,185 505,180" fill="#e74c3c"/>
    <polygon points="455,175 440,180 455,185" fill="#bdc3c7"/>
    <animateTransform attributeName="transform" 
                      xlink:href="#weather-vane"
                      type="rotate" 
                      from="0 455 180" 
                      to="30 455 180" 
                      dur="10s" 
                      values="0 455 180; 15 455 180; -15 455 180; 0 455 180"
                      keyTimes="0; 0.3; 0.7; 1"
                      repeatCount="indefinite"/>
    
    <!-- Rain gauge -->
    <rect x="430" y="210" width="15" height="25" fill="#3498db" opacity="0.7" stroke="#2980b9" stroke-width="1"/>
    <rect x="425" y="235" width="25" height="5" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    
    <!-- Temperature sensor housing -->
    <rect x="470" y="210" width="20" height="15" rx="2" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
    <line x1="475" y1="215" x2="485" y2="215" stroke="#e74c3c" stroke-width="2"/>
    <line x1="475" y1="220" x2="480" y2="220" stroke="#e74c3c" stroke-width="2"/>
  </g>
  
  <!-- Sensors data transmission -->
  <g opacity="0.6">
    <!-- Wireless signal waves -->
    <path d="M470,190 Q530,170 560,180" fill="none" stroke="#3498db" stroke-width="2" stroke-dasharray="5,5">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M470,200 Q540,190 580,210" fill="none" stroke="#3498db" stroke-width="2" stroke-dasharray="5,5">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" begin="1s" repeatCount="indefinite"/>
    </path>
    <path d="M470,210 Q550,220 590,240" fill="none" stroke="#3498db" stroke-width="2" stroke-dasharray="5,5">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.5s" begin="0.5s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Laptop showing data -->
  <g transform="translate(580, 230)">
    <!-- Laptop base -->
    <rect x="0" y="20" width="100" height="70" rx="5" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
    <!-- Laptop screen -->
    <rect x="10" y="0" width="80" height="50" rx="3" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
    <rect x="15" y="5" width="70" height="40" fill="#2980b9" stroke="#2c3e50" stroke-width="1"/>
    
    <!-- Graph on screen -->
    <polyline points="20,35 30,25 40,30 50,20 60,15 70,25 80,15" fill="none" stroke="#e74c3c" stroke-width="1.5"/>
    <polyline points="20,40 30,35 40,30 50,35 60,30 70,35 80,30" fill="none" stroke="#2ecc71" stroke-width="1.5"/>
  </g>
  
  <!-- Animated weather elements -->
  <g>
    <!-- Sun -->
    <circle cx="650" cy="100" r="30" fill="#f1c40f" opacity="0.8">
      <animate attributeName="opacity" values="0.7;0.9;0.7" dur="5s" repeatCount="indefinite" />
    </circle>
    
    <!-- Cloud -->
    <g transform="translate(600, 150)">
      <circle cx="0" cy="0" r="20" fill="#ecf0f1" opacity="0.8"/>
      <circle cx="20" cy="-10" r="25" fill="#ecf0f1" opacity="0.8"/>
      <circle cx="40" cy="0" r="20" fill="#ecf0f1" opacity="0.8"/>
      <rect x="0" y="0" width="40" height="20" rx="10" fill="#ecf0f1" opacity="0.8"/>
      <animate attributeName="transform" from="translate(600, 150)" to="translate(620, 150)" dur="20s" values="translate(600, 150); translate(620, 150); translate(600, 150)" keyTimes="0; 0.5; 1" repeatCount="indefinite"/>
    </g>
    
    <!-- Raindrops -->
    <g>
      <path d="M620,180 Q625,170 630,180 L630,195 Q625,205 620,195 Z" fill="#3498db" opacity="0.6">
        <animate attributeName="transform" values="translate(0,0); translate(0,60); translate(0,0)" begin="0.5s" dur="3s" repeatCount="indefinite" />
      </path>
      <path d="M640,190 Q645,180 650,190 L650,205 Q645,215 640,205 Z" fill="#3498db" opacity="0.6">
        <animate attributeName="transform" values="translate(0,0); translate(0,60); translate(0,0)" begin="0s" dur="2.5s" repeatCount="indefinite" />
      </path>
      <path d="M660,185 Q665,175 670,185 L670,200 Q665,210 660,200 Z" fill="#3498db" opacity="0.6">
        <animate attributeName="transform" values="translate(0,0); translate(0,60); translate(0,0)" begin="1s" dur="2.8s" repeatCount="indefinite" />
      </path>
    </g>
  </g>
  
  <!-- Data transmission to cloud -->
  <g>
    <path d="M670,265 Q700,230 730,240" stroke="#3498db" stroke-width="2" stroke-dasharray="5,3" fill="none">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite"/>
    </path>
    
    <!-- Cloud storage -->
    <g transform="translate(730, 220)">
      <circle cx="20" cy="20" r="15" fill="#ecf0f1" opacity="0.8"/>
      <circle cx="35" cy="15" r="15" fill="#ecf0f1" opacity="0.8"/>
      <circle cx="50" cy="20" r="15" fill="#ecf0f1" opacity="0.8"/>
      <rect x="20" y="20" width="30" height="15" rx="7.5" fill="#ecf0f1" opacity="0.8"/>
      
      <!-- Data center icon inside cloud -->
      <rect x="30" y="15" width="10" height="15" fill="#34495e" stroke="#2c3e50" stroke-width="0.5" opacity="0.8"/>
      <line x1="32" y1="17" x2="38" y2="17" stroke="#3498db" stroke-width="0.5"/>
      <line x1="32" y1="20" x2="38" y2="20" stroke="#3498db" stroke-width="0.5"/>
      <line x1="32" y1="23" x2="38" y2="23" stroke="#3498db" stroke-width="0.5"/>
      <line x1="32" y1="26" x2="38" y2="26" stroke="#3498db" stroke-width="0.5"/>
    </g>
  </g>
  
  <!-- Ground/grass -->
  <rect x="0" y="300" width="800" height="5" fill="#27ae60" opacity="0.5"/>
  <rect x="0" y="305" width="800" height="195" fill="#2ecc71" opacity="0.2"/>
  
  <!-- System name -->
  <text x="400" y="400" text-anchor="middle" font-family="Arial" font-size="24" fill="#ecf0f1" opacity="0.8">HomeWeather Station</text>
</svg>