<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3498db;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#skyGradient)" opacity="0.3"/>
  
  <!-- Sun -->
  <circle cx="650" cy="120" r="60" fill="#f39c12" opacity="0.8">
    <animate attributeName="opacity" values="0.7;0.9;0.7" dur="5s" repeatCount="indefinite" />
  </circle>
  
  <!-- Sun rays -->
  <g opacity="0.7">
    <line x1="650" y1="40" x2="650" y2="10" stroke="#f39c12" stroke-width="6" stroke-linecap="round">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" />
    </line>
    <line x1="730" y1="120" x2="760" y2="120" stroke="#f39c12" stroke-width="6" stroke-linecap="round">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite" />
    </line>
    <line x1="706" y1="64" x2="730" y2="40" stroke="#f39c12" stroke-width="6" stroke-linecap="round">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite" />
    </line>
    <line x1="706" y1="176" x2="730" y2="200" stroke="#f39c12" stroke-width="6" stroke-linecap="round">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2.5s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Clouds -->
  <g fill="#ECF0F1" opacity="0.8">
    <!-- Cloud 1 -->
    <g transform="translate(-50, 0)">
      <circle cx="150" cy="150" r="40" />
      <circle cx="200" cy="130" r="45" />
      <circle cx="250" cy="150" r="35" />
      <rect x="150" y="150" width="100" height="40" rx="20" ry="20" />
      <animate attributeName="transform" from="translate(-50, 0)" to="translate(0, 0)" dur="20s" repeatCount="indefinite" />
    </g>
    
    <!-- Cloud 2 -->
    <g transform="translate(550, 100)">
      <circle cx="100" cy="100" r="30" />
      <circle cx="140" cy="90" r="35" />
      <circle cx="180" cy="100" r="25" />
      <rect x="100" y="100" width="80" height="30" rx="15" ry="15" />
      <animate attributeName="transform" from="translate(550, 100)" to="translate(500, 100)" dur="25s" repeatCount="indefinite" />
    </g>
  </g>

  <!-- Rain drops -->
  <g>
    <path d="M170,250 Q175,240 180,250 L180,270 Q175,280 170,270 Z" fill="#3498db" opacity="0.6">
      <animate attributeName="transform" values="translate(0,0); translate(0,100); translate(0,0)" dur="3s" repeatCount="indefinite" />
    </path>
    <path d="M210,230 Q215,220 220,230 L220,250 Q215,260 210,250 Z" fill="#3498db" opacity="0.6">
      <animate attributeName="transform" values="translate(0,0); translate(0,100); translate(0,0)" dur="2.7s" begin="0.5s" repeatCount="indefinite" />
    </path>
    <path d="M250,240 Q255,230 260,240 L260,260 Q255,270 250,260 Z" fill="#3498db" opacity="0.6">
      <animate attributeName="transform" values="translate(0,0); translate(0,100); translate(0,0)" dur="2.9s" begin="1s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- Weather Charts -->
  <g transform="translate(100, 350)">
    <!-- Chart background -->
    <rect x="0" y="0" width="600" height="200" rx="10" ry="10" fill="#34495e" opacity="0.6"/>
    
    <!-- Chart grid -->
    <g stroke="#ecf0f1" stroke-width="1" opacity="0.2">
      <line x1="0" y1="50" x2="600" y2="50" />
      <line x1="0" y1="100" x2="600" y2="100" />
      <line x1="0" y1="150" x2="600" y2="150" />
      <line x1="100" y1="0" x2="100" y2="200" />
      <line x1="200" y1="0" x2="200" y2="200" />
      <line x1="300" y1="0" x2="300" y2="200" />
      <line x1="400" y1="0" x2="400" y2="200" />
      <line x1="500" y1="0" x2="500" y2="200" />
    </g>
    
    <!-- Temperature line -->
    <path d="M50,150 C100,120 150,90 200,80 C250,70 300,100 350,90 C400,80 450,60 500,40 C550,30 580,50 600,30" 
          stroke="#e74c3c" stroke-width="3" fill="none" opacity="0.8"/>
    
    <!-- Humidity line -->
    <path d="M50,100 C100,110 150,130 200,120 C250,110 300,90 350,100 C400,110 450,130 500,110 C550,90 580,80 600,70" 
          stroke="#3498db" stroke-width="3" fill="none" opacity="0.8"/>
          
    <!-- Prediction indicators -->
    <circle cx="600" cy="30" r="6" fill="#e74c3c" opacity="0.8">
      <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="70" r="6" fill="#3498db" opacity="0.8">
      <animate attributeName="r" values="6;8;6" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Machine Learning icons -->
  <g transform="translate(400, 150)" opacity="0.8">
    <!-- Neural network representation -->
    <circle cx="0" cy="0" r="10" fill="#9b59b6"/>
    <circle cx="40" cy="-30" r="10" fill="#9b59b6"/>
    <circle cx="40" cy="0" r="10" fill="#9b59b6"/>
    <circle cx="40" cy="30" r="10" fill="#9b59b6"/>
    <circle cx="80" cy="-15" r="10" fill="#9b59b6"/>
    <circle cx="80" cy="15" r="10" fill="#9b59b6"/>
    <circle cx="120" cy="0" r="10" fill="#9b59b6"/>
    
    <line x1="10" y1="0" x2="30" y2="-30" stroke="#9b59b6" stroke-width="2"/>
    <line x1="10" y1="0" x2="30" y2="0" stroke="#9b59b6" stroke-width="2"/>
    <line x1="10" y1="0" x2="30" y2="30" stroke="#9b59b6" stroke-width="2"/>
    
    <line x1="50" y1="-30" x2="70" y2="-15" stroke="#9b59b6" stroke-width="2"/>
    <line x1="50" y1="-30" x2="70" y2="15" stroke="#9b59b6" stroke-width="2"/>
    <line x1="50" y1="0" x2="70" y2="-15" stroke="#9b59b6" stroke-width="2"/>
    <line x1="50" y1="0" x2="70" y2="15" stroke="#9b59b6" stroke-width="2"/>
    <line x1="50" y1="30" x2="70" y2="-15" stroke="#9b59b6" stroke-width="2"/>
    <line x1="50" y1="30" x2="70" y2="15" stroke="#9b59b6" stroke-width="2"/>
    
    <line x1="90" y1="-15" x2="110" y2="0" stroke="#9b59b6" stroke-width="2"/>
    <line x1="90" y1="15" x2="110" y2="0" stroke="#9b59b6" stroke-width="2"/>
    
    <animateTransform attributeName="transform" 
                      type="rotate" 
                      from="0 400 150" 
                      to="360 400 150" 
                      dur="60s" 
                      repeatCount="indefinite"/>
  </g>
</svg>